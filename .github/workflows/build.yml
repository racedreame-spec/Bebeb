name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek.zip jika ada
        run: |
          if [ -f proyek.zip ]; then mkdir -p src && unzip -oq proyek.zip -d src; fi
          D=.; [ -f src/settings.gradle.kts ] && D=src
          echo "D=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: ${{ env.D }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JawabOtomatis-APK
          path: ${{ env.D }}/app/build/outputs/apk/debug/*.apk
